version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - (cd api && npm install)
    build:
      commands:
        - npx tsc
        - (cd api && npx tsc)
        - ls -la
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
    discard-paths: no
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '*.json'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
  - pattern: '*.ico'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=86400'
